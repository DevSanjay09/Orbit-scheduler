services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: orbit_scheduler
      POSTGRES_PASSWORD: "LnTr6GWeIH1m39EQqioZtIWOVJLcxoDC"
    volumes:
      - orbit_scheduler_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Yr3BGkK3ykshOKoIoh9vBm_fwTcZj9ew"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: orbit_scheduler_test
      POSTGRES_PASSWORD: "1tnDkxfFBDsugc2sKdFc6BMaQVT5uG3j"
    volumes:
      - orbit_scheduler_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "kJhL81gkE087le1KqzglLTijBdWcWCke"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  orbit_scheduler_data:
  orbit_scheduler_test_data:
